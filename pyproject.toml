[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-director"
version = "0.1.0"
description = "Agent-first, provider-agnostic orchestration for AI video production"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "AI Video Director contributors" }]
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "psycopg[binary]>=3.2",
  "redis>=5.0",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "fakeredis>=2.23", "ruff>=0.6"]

[project.scripts]
video-director = "video_director.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
