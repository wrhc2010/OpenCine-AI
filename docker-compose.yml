services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DIRECTOR_DATABASE_URL: postgresql://director:director@postgres:5432/director
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: video-director
      DIRECTOR_PARALLELISM: ${DIRECTOR_PARALLELISM:-1}
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
      - minio
  worker:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["python", "-m", "video_director.cli", "worker"]
    environment:
      DIRECTOR_DATABASE_URL: postgresql://director:director@postgres:5432/director
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: video-director
      DIRECTOR_PARALLELISM: ${DIRECTOR_PARALLELISM:-1}
    depends_on:
      - postgres
      - redis
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: director
      POSTGRES_USER: director
      POSTGRES_PASSWORD: director
    volumes:
      - postgres-data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: director
      MINIO_ROOT_PASSWORD: director-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
volumes:
  postgres-data:
  minio-data:
