services:
  api:
    image: ${OPENCINE_API_IMAGE:-ghcr.io/wrhc2010/opencine-ai-api}:${OPENCINE_IMAGE_TAG:-v0.1.1}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      DIRECTOR_DATABASE_URL: postgresql://director:director@postgres:5432/director
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: video-director
      DIRECTOR_PARALLELISM: ${DIRECTOR_PARALLELISM:-1}
      DIRECTOR_AUTH_ENABLED: ${DIRECTOR_AUTH_ENABLED:-true}
      DIRECTOR_HOST_CHECK_ENABLED: ${DIRECTOR_HOST_CHECK_ENABLED:-false}
      DIRECTOR_CORS_ENABLED: ${DIRECTOR_CORS_ENABLED:-false}
      DIRECTOR_RATE_LIMIT_ENABLED: ${DIRECTOR_RATE_LIMIT_ENABLED:-false}
      DIRECTOR_CONTENT_SAFETY_ENABLED: ${DIRECTOR_CONTENT_SAFETY_ENABLED:-false}
      DIRECTOR_PROVIDER_SAFETY_ENABLED: ${DIRECTOR_PROVIDER_SAFETY_ENABLED:-false}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    image: ${OPENCINE_API_IMAGE:-ghcr.io/wrhc2010/opencine-ai-api}:${OPENCINE_IMAGE_TAG:-v0.1.1}
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["python", "-m", "video_director.cli", "worker"]
    environment:
      DIRECTOR_DATABASE_URL: postgresql://director:director@postgres:5432/director
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_ENDPOINT: http://minio:9000
      OBJECT_STORAGE_BUCKET: video-director
      DIRECTOR_PARALLELISM: ${DIRECTOR_PARALLELISM:-1}
      DIRECTOR_AUTH_ENABLED: ${DIRECTOR_AUTH_ENABLED:-true}
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: director
      POSTGRES_USER: director
      POSTGRES_PASSWORD: director
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U director -d director"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: director
      MINIO_ROOT_PASSWORD: director-secret
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/data
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "until mc alias set local http://minio:9000 director director-secret; do sleep 2; done;
      mc mb --ignore-existing local/video-director"
  web:
    image: ${OPENCINE_WEB_IMAGE:-ghcr.io/wrhc2010/opencine-ai-web}:${OPENCINE_IMAGE_TAG:-v0.1.1}
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/healthz >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres-data:
  minio-data:
